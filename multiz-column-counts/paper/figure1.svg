<text x="48.0" y="148.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#0072B2">K = 5 rows</text>
<text x="198.0" y="60.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#E69F00">column of B</text>
<text x="198.0" y="140.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#E69F00">L = 4 rows</text>
<text x="123.0" y="172.0" font-size="8" text-anchor="middle" font-weight="bold" fill="#D55E00">K × L = 20 pair scores</text>
<text x="123.0" y="183.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#000000">for every DP cell, four times over</text>
<text x="123.0" y="192.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#000000">(the substitution sum and three gap sums)</text>
