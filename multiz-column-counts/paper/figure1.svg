<text x="460.0" y="122.0" font-size="7.5" text-anchor="middle" font-weight="bold" fill="#009E73">2·w(A) + 2·w(G)</text>
<text x="460.0" y="132.0" font-size="6" text-anchor="middle" font-weight="normal" fill="#000000">the DP cell</text>
<text x="460.0" y="172.0" font-size="8" text-anchor="middle" font-weight="bold" fill="#009E73">K + L = 9 rows</text>
<text x="460.0" y="183.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#000000">summarised once per column</text>
<text x="460.0" y="192.0" font-size="6.5" text-anchor="middle" font-weight="normal" fill="#000000">then a short dot product per cell</text>
<rect x="8.0" y="204.0" width="494.0" height="30.0" fill="#F2F2F2" stroke="none" stroke-width="0.6"/>
<text x="16.0" y="216.0" font-size="6.5" text-anchor="start" font-weight="normal" fill="#000000">Gap sums are counted the same way. A row's gap cost depends only on whether it holds a dash in this column</text>
<text x="16.0" y="226.0" font-size="6.5" text-anchor="start" font-weight="normal" fill="#000000">and in the previous one, so each row falls into one of 4 dash classes. All terms are integers: the totals equal the pair sums exactly.</text>
<text x="8.0" y="254.0" font-size="11" text-anchor="start" font-weight="bold" fill="#000000">C</text>
<text x="22.0" y="254.0" font-size="8" text-anchor="start" font-weight="bold" fill="#000000">One deep merge, as recorded in multiz#28</text>
<text x="262.0" y="254.0" font-size="6.5" text-anchor="start" font-weight="normal" fill="#000000">Blocks of about 35 rows against 43, cs10 included:</text>
<text x="262.0" y="265.0" font-size="7" text-anchor="start" font-weight="bold" fill="#D55E00">11.3: every pair of the rows yama aligns, in every cell</text>
<text x="262.0" y="276.0" font-size="7" text-anchor="start" font-weight="bold" fill="#009E73">11.4: those rows summarised once per column</text>
<text x="262.0" y="296.0" font-size="8" text-anchor="start" font-weight="bold" fill="#000000">33.8× faster on this merge,</text>
<text x="262.0" y="307.0" font-size="6.5" text-anchor="start" font-weight="normal" fill="#000000">identical output (single upstream runs)</text>
